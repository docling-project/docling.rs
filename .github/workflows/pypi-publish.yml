# Publish the `docling-rs` PyPI package (the PyO3 Python bindings in
# crates/docling-py) for a chosen release. Like the npm package, the bindings are
# a compiled native extension, so it can't be a one-line `twine upload`: a
# self-contained sdist is built first (maturin vendors the path-dependency
# crates), platform wheels are built from it on a matrix of runners (one abi3
# wheel per OS/arch — `abi3-py39`, so a single wheel covers every Python ≥ 3.9),
# and a publish job uploads the sdist + wheels to PyPI.
#
# Only allow-listed / GitHub-owned actions are used: the wheels are built with
# `pypa/cibuildwheel` (which orchestrates the manylinux containers and auditwheel
# repair itself) and uploaded with `pypa/gh-action-pypi-publish`.
#
# Trigger: manual dispatch only (so is npm-publish.yml). A GitHub Release does
# NOT publish to PyPI: PyPI caps a project's total size (10 GiB), and a
# release per merge (~100 MB of docling-rs wheels + ~63 MB of docling-rs-cuda
# each, 139 releases in three months) filled docling-rs and failed v2.22.0
# half-way. The maintainer picks the releases worth publishing — release.yml
# runs this with npm, the images and the CLI binaries; alone, it repairs a
# failed PyPI channel:
#
#     gh workflow run pypi-publish.yml -f tag=v2.23.0
#
# `tag` checks the release out and publishes its version; blank builds the
# dispatched ref at the workspace version (the root Cargo.toml), `version`
# overrides either. `cuda_wheel` (on by default) adds docling-rs-cuda. After a
# release tag's launcher is up, the MCP registry entry follows
# (mcp-registry.yml, called below). Files already on PyPI are skipped, so a
# re-run repairs a partial publish — within 14 days of the release's first
# upload, after which PyPI accepts no new files for it.
#
# No secrets: publishing uses PyPI Trusted Publishing (OIDC), like
# docling-core's pypi.yml. This requires a one-time setup on PyPI — add a trusted
# publisher for the `docling-rs` project pointing at this repo, workflow file
# (`pypi-publish.yml`) and environment (`pypi`). GitHub then mints a short-lived
# OIDC token per run; there is no API token to store or rotate.
#
# The ONNX Runtime is statically bundled at build time (`ort` `download-binaries`)
# and pdfium is loaded at runtime from the model cache, so the wheels are
# self-contained for the declarative path and need no extra native setup here —
# same story as the npm build.

name: pypi publish

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build (e.g. v0.16.0). Blank = current ref."
        required: false
        default: ""
      version:
        description: "Override the PyPI version (e.g. 0.16.0). Blank = tag, or workspace version from the root Cargo.toml."
        required: false
        default: ""
      cuda_wheel:
        description: "Also build and publish the docling-rs-cuda wheel (Linux x86_64, CUDA EP compiled in)."
        required: false
        type: boolean
        default: true

concurrency:
  group: pypi-publish-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sdist:
    name: sdist
    # On a release event only the `v<version>` releases ci.yml cuts are
    # published (every other job hangs off this one).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      # Version resolution mirrors npm-publish.yml: explicit `version` input,
      # else the release `tag`, else the workspace version from the root
      # Cargo.toml (NOT pyproject.toml — the version committed there is a
      # local-build fallback that release.sh never bumps). The resolved version
      # is always patched into [project].version before the sdist is built so
      # every wheel (built from the sdist) inherits it.
      - name: Resolve version
        shell: bash
        working-directory: crates/docling-py
        run: |
          v="${{ inputs.version }}"
          if [ -z "$v" ] && [ -n "${{ inputs.tag }}" ]; then v="${{ inputs.tag }}"; v="${v#v}"; fi
          if [ -z "$v" ]; then
            v="$(grep -m1 '^version = ' ../../Cargo.toml | sed -E 's/.*"([^"]+)".*/\1/')"
          fi
          sed -i.bak -E "0,/^version = \".*\"/s//version = \"$v\"/" pyproject.toml && rm -f pyproject.toml.bak
          echo "Building docling-rs $v"

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      # A maturin sdist vendors docling-py's path-dependency crates (docling,
      # docling-core, docling-pdf, docling-asr) into a self-contained tarball that
      # builds from source with a plain `pip install` — the input cibuildwheel
      # unpacks for the per-platform wheels.
      - name: Build sdist
        run: |
          python -m pip install "maturin>=1.5,<2"
          maturin sdist -m crates/docling-py/Cargo.toml --out dist

      - uses: actions/upload-artifact@v7
        with:
          name: sdist
          path: dist/*.tar.gz
          if-no-files-found: error

  wheels:
    name: wheel ${{ matrix.arch }}
    needs: sdist
    runs-on: ${{ matrix.host }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - host: ubuntu-22.04
            arch: x86_64
          # Native ARM64 Linux runner — avoids QEMU / cross-compiling the ONNX build.
          - host: ubuntu-24.04-arm
            arch: aarch64
          - host: windows-latest
            arch: AMD64
          # Apple Silicon (#816), native on the hosted `macos-15` runner
          # (`macos-14` retired 2026-11-02 — its brownout failed the v2.62.0
          # wheel job; actions/runner-images#13518; the image family ci.yml's
          # coreml check job uses; the "macOS runners are blocked"
          # note this matrix carried dated from the repository's previous
          # home). Intel macs install the sdist, which builds from source
          # and, pyke shipping no `x86_64-apple-darwin` ONNX Runtime, only as
          # an `ort-load-dynamic` build (cli-binaries.yml's header).
          # docling-onnx's build.rs links the compiler-rt builtins the
          # CoreML-enabled ONNX Runtime needs under docling-py's thin LTO.
          - host: macos-15
            arch: arm64
    steps:
      - name: Download sdist
        uses: actions/download-artifact@v8
        with:
          name: sdist
          path: sdist

      # Unpack the self-contained sdist to a fixed dir for cibuildwheel to build.
      - name: Unpack sdist
        shell: bash
        run: |
          mkdir pkg
          tar -xzf sdist/*.tar.gz -C pkg --strip-components=1

      # Fetch every crate the build needs here, on the runner (with retries),
      # and point cargo at the copies: the build itself — inside the
      # manylinux container for the cibuildwheel jobs — then never talks to
      # crates.io, whose CDN the container could not reach in a release run
      # ("Could not connect to server" on static.crates.io before anything
      # compiled). Only the wheel builds vendor; the published sdist stays
      # small. ONNX Runtime's binaries (`ort`'s download-binaries) are still
      # fetched by its build script.
      - name: Vendor crates
        shell: bash
        working-directory: pkg
        env:
          CARGO_NET_RETRY: "10"
        run: |
          MANIFEST="$(sed -n 's/^manifest-path = "\(.*\)"/\1/p' pyproject.toml)"
          mkdir -p .cargo
          cargo vendor --locked --manifest-path "${MANIFEST:-Cargo.toml}" vendor > .cargo/config.toml
          cat .cargo/config.toml

      - name: Build wheels
        uses: pypa/cibuildwheel@v4.2.0
        with:
          package-dir: pkg
          output-dir: wheelhouse
        env:
          # abi3-py39 → build once (on cp39); the wheel covers every Python ≥ 3.9.
          CIBW_BUILD: "cp39-*"
          CIBW_ARCHS: ${{ matrix.arch }}
          # `ort`'s `download-binaries` ships ONNX Runtime only for glibc targets,
          # not musl — so build manylinux wheels only, never musllinux.
          CIBW_SKIP: "*-musllinux*"
          # Broad-compat Linux wheels; ONNX is statically linked so no repair pulls.
          CIBW_MANYLINUX_X86_64_IMAGE: manylinux_2_28
          CIBW_MANYLINUX_AARCH64_IMAGE: manylinux_2_28
          # The manylinux containers have no Rust — install the toolchain once per
          # container and put cargo on PATH for the maturin build. (The macOS
          # and Windows builds run on the runner itself, whose image ships
          # rustup + stable.)
          CIBW_BEFORE_ALL_LINUX: "curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain stable"
          CIBW_ENVIRONMENT_LINUX: 'PATH="$HOME/.cargo/bin:$PATH"'
          # macOS: the wheel's platform tag (macosx_13_0_arm64). cibuildwheel
          # would default to 11.0, the first macOS on Apple Silicon, but pyke's
          # prebuilt ONNX Runtime objects are compiled for 13.4 — on an older
          # macOS pip takes the sdist instead of a wheel that may not run.
          CIBW_ENVIRONMENT_MACOS: 'MACOSX_DEPLOYMENT_TARGET=13.0'
          # Import the installed wheel inside the build container — on Linux
          # that is the manylinux_2_28 image, i.e. the wheel's glibc floor.
          # auditwheel cannot catch a symbol the floor lacks: the native module
          # is a shared object, which links with undefined symbols, and
          # auditwheel takes an unversioned undefined symbol for one the
          # interpreter provides. That is how 2.35.0 shipped wheels that failed
          # `import docling_rs` on glibc < 2.38 (`undefined symbol:
          # __isoc23_strtol`, from the prebuilt static ONNX Runtime — now
          # defined in docling-onnx's glibc_compat, #745). Python dlopens
          # extension modules with RTLD_NOW, so the import binds every symbol.
          CIBW_TEST_COMMAND: python -c "import docling_rs"

      - uses: actions/upload-artifact@v7
        with:
          name: wheel-${{ matrix.arch }}
          path: wheelhouse/*.whl
          if-no-files-found: error

  # IBM Z wheel (#504): cross-compiled on the x86_64 runner with maturin's
  # zig mode — the manylinux_2_28_s390x container would compile the whole
  # workspace under QEMU for hours, and the distro cross toolchain links
  # against its glibc 2.39 sysroot (maturin's audit then rejects the
  # manylinux_2_28 tag: exp@GLIBC_2.29, dlopen@GLIBC_2.34, pidfd_spawnp@2.39…),
  # while zig targets glibc 2.28 directly, so the wheel installs on RHEL 8/9
  # era mainframe Linux. abi3 means one wheel. Built with `ort-load-dynamic`:
  # pyke ships no ONNX Runtime for s390x, so the module dlopens the library
  # `download_models()` fetches into the cache on an s390x host
  # (onnxruntime-linux-s390x.tar.gz from the models release).
  wheel-s390x:
    name: wheel s390x (cross, zig)
    needs: sdist
    runs-on: ubuntu-24.04
    steps:
      - name: Download sdist
        uses: actions/download-artifact@v8
        with:
          name: sdist
          path: sdist

      - name: Unpack sdist
        shell: bash
        run: |
          mkdir pkg
          tar -xzf sdist/*.tar.gz -C pkg --strip-components=1

      - name: Install Rust (stable + s390x target)
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add s390x-unknown-linux-gnu

      # Fetch every crate the build needs here, on the runner (with retries),
      # and point cargo at the copies: the build itself — inside the
      # manylinux container for the cibuildwheel jobs — then never talks to
      # crates.io, whose CDN the container could not reach in a release run
      # ("Could not connect to server" on static.crates.io before anything
      # compiled). Only the wheel builds vendor; the published sdist stays
      # small. ONNX Runtime's binaries (`ort`'s download-binaries) are still
      # fetched by its build script.
      - name: Vendor crates
        shell: bash
        working-directory: pkg
        env:
          CARGO_NET_RETRY: "10"
        run: |
          MANIFEST="$(sed -n 's/^manifest-path = "\(.*\)"/\1/p' pyproject.toml)"
          mkdir -p .cargo
          cargo vendor --locked --manifest-path "${MANIFEST:-Cargo.toml}" vendor > .cargo/config.toml
          cat .cargo/config.toml

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Build wheel
        working-directory: pkg
        run: |
          python -m pip install "maturin>=1.5,<2" ziglang
          maturin build --release --zig --target s390x-unknown-linux-gnu --manylinux 2_28 \
            --features ort-load-dynamic -i python3.11 --out ../wheelhouse
          ls -la ../wheelhouse

      - uses: actions/upload-artifact@v7
        with:
          name: wheel-s390x
          path: wheelhouse/*.whl
          if-no-files-found: error

  # CUDA wheel (PyPI `docling-rs-cuda`): the same sdist built with
  # `--features cuda`, Linux x86_64 only — the renamed package installs the
  # same `docling_rs` module (mutually exclusive with `docling-rs`) and
  # defaults to `auto`: GPU when usable, CPU fallback (`DOCLING_RS_EP=cpu`
  # forces CPU).
  # Operational notes:
  # - the wheel bundles libonnxruntime_providers_{shared,cuda}.so; if PyPI
  #   rejects the upload for size, request a per-project file-size bump
  #   (onnxruntime-gpu is the precedent). CUDA 13 + cuDNN 9 remain *system*
  #   requirements at runtime — the wheel does not ship them.
  # - PyPI Trusted Publishing is per-project: register this workflow as a
  #   trusted publisher on the `docling-rs-cuda` project as well, or the
  #   publish step will reject that wheel.
  # - NOT built in a manylinux_2_28 container like the CPU wheels: the pyke
  #   CUDA ONNX Runtime static binaries need glibc >= 2.38 (__isoc23_*
  #   symbols), so linking in a 2.28 container fails. Building on plain
  #   ubuntu-24.04 (glibc 2.39) works and maturin's audit tags the wheel
  #   manylinux_2_38 — i.e. the wheel requires Ubuntu 24.04+/Debian 13+ era
  #   glibc at runtime, which matches the native `--features cuda` story.
  wheel-cuda:
    name: wheel x86_64 (docling-rs-cuda)
    # Manual runs opt in with `cuda_wheel`; a release builds it unconditionally.
    if: inputs.cuda_wheel
    needs: sdist
    runs-on: ubuntu-24.04
    steps:
      - name: Download sdist
        uses: actions/download-artifact@v8
        with:
          name: sdist
          path: sdist

      - name: Unpack sdist
        run: |
          mkdir pkg
          tar -xzf sdist/*.tar.gz -C pkg --strip-components=1

      - name: Install Rust (stable)
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      # Fetch every crate the build needs here, on the runner (with retries),
      # and point cargo at the copies: the build itself — inside the
      # manylinux container for the cibuildwheel jobs — then never talks to
      # crates.io, whose CDN the container could not reach in a release run
      # ("Could not connect to server" on static.crates.io before anything
      # compiled). Only the wheel builds vendor; the published sdist stays
      # small. ONNX Runtime's binaries (`ort`'s download-binaries) are still
      # fetched by its build script.
      - name: Vendor crates
        shell: bash
        working-directory: pkg
        env:
          CARGO_NET_RETRY: "10"
        run: |
          MANIFEST="$(sed -n 's/^manifest-path = "\(.*\)"/\1/p' pyproject.toml)"
          mkdir -p .cargo
          cargo vendor --locked --manifest-path "${MANIFEST:-Cargo.toml}" vendor > .cargo/config.toml
          cat .cargo/config.toml

      - name: Build docling-rs-cuda wheel
        run: |
          python3 -m pip install --user "maturin>=1.5,<2"
          cd pkg
          sed -i 's/^name = "docling-rs"$/name = "docling-rs-cuda"/' pyproject.toml
          # Where the crate manifest sits depends on the maturin that built the
          # sdist: at the root (older layouts) or in a subdirectory pointed at
          # by [tool.maturin] manifest-path (1.8+ vendors the path-dependency
          # crates as siblings — e.g. docling-py/Cargo.toml). Resolve it from
          # pyproject.toml instead of assuming, and let cargo report the
          # matching target directory (the crate is its own workspace, so it
          # is NOT ./target when the manifest moved).
          MANIFEST="$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml","rb"))["tool"]["maturin"].get("manifest-path", "Cargo.toml"))')"
          TARGET_DIR="$(cargo metadata --no-deps --format-version 1 --manifest-path "$MANIFEST" | python3 -c 'import json, sys; print(json.load(sys.stdin)["target_directory"])')"
          # ONNX Runtime dlopens the provider libraries by bare name; give the
          # native module an $ORIGIN rpath so the copies shipped inside the
          # wheel are found without any environment setup.
          export RUSTFLAGS='-C link-arg=-Wl,-rpath,$ORIGIN'
          # Build once so ort fetches the CUDA ONNX Runtime and copy-dylibs
          # drops the provider libraries next to <target>/release...
          cargo build --release --features cuda --manifest-path "$MANIFEST"
          cp "$TARGET_DIR/release/libonnxruntime_providers_shared.so" \
             "$TARGET_DIR/release/libonnxruntime_providers_cuda.so" \
             python/docling_rs/
          # ...then assemble the wheel (cargo cache is warm) with the provider
          # libraries riding along as package data (pyproject include glob).
          # The wheel MUST contain them — fail the job if the glob missed.
          python3 -m maturin build --release --features cuda --out ../wheelhouse
          python3 - <<'EOF'
          import glob, sys, zipfile
          wheel = glob.glob("../wheelhouse/*.whl")[0]
          names = zipfile.ZipFile(wheel).namelist()
          want = ["docling_rs/libonnxruntime_providers_shared.so",
                  "docling_rs/libonnxruntime_providers_cuda.so"]
          missing = [w for w in want if w not in names]
          sys.exit(f"provider libs missing from {wheel}: {missing}" if missing else 0)
          EOF

      - uses: actions/upload-artifact@v7
        with:
          name: wheel-cuda
          path: wheelhouse/*.whl
          if-no-files-found: error

  publish:
    name: publish to PyPI
    needs: [sdist, wheels, wheel-cuda, wheel-s390x]
    # wheel-cuda is optional (gated on the cuda_wheel input): publish when it
    # succeeded or was skipped, never when anything actually failed.
    if: ${{ !cancelled() && needs.sdist.result == 'success' && needs.wheels.result == 'success' && needs.wheel-s390x.result == 'success' && (needs.wheel-cuda.result == 'success' || needs.wheel-cuda.result == 'skipped') }}
    runs-on: ubuntu-latest
    # Trusted Publishing (OIDC): no token secret. `id-token: write` lets the job
    # mint the OIDC token PyPI verifies against its trusted-publisher config; the
    # `pypi` environment name is part of what PyPI matches on.
    environment:
      name: pypi
      url: https://pypi.org/p/docling-rs
    permissions:
      contents: read # the checkout for the size check
      id-token: write
    steps:
      # Only the size check below; the upload itself needs no checkout.
      - uses: actions/checkout@v7
        with:
          sparse-checkout: scripts/ci

      # All wheels + the sdist → a single dist/ for the upload. By name: the
      # docling-rs-mcp launcher (below) uploads on its own, so a launcher
      # problem can never hold back a docling-rs release.
      - name: Download the sdist
        uses: actions/download-artifact@v8
        with:
          name: sdist
          path: dist

      - name: Download the wheels
        uses: actions/download-artifact@v8
        with:
          pattern: wheel-*
          path: dist
          merge-multiple: true

      # PyPI refuses files past a project's total-size limit one by one,
      # after the earlier files of the upload went through — v2.22.0 got its
      # aarch64 wheel only. Fail before uploading anything instead, and warn
      # near the limit. PYPI_SIZE_LIMIT_GIB (repository variable) records a
      # limit PyPI raised: `docling-rs=20,docling-rs-cuda=15`.
      - name: Check room under the PyPI size limits
        env:
          PYPI_SIZE_LIMIT_GIB: ${{ vars.PYPI_SIZE_LIMIT_GIB }}
        run: python3 scripts/ci/pypi_room.py dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
          attestations: true
          # Idempotent re-runs: don't fail if a version is already uploaded.
          skip-existing: true

  # `docling-rs-mcp` (#669): the pure-Python launcher behind
  # `uvx docling-rs-mcp`, MarkItDown's `markitdown-mcp` counterpart. It has
  # no code of its own — it pins this run's docling-rs, whose wheels carry
  # the MCP server (`docling_rs.mcp`) — so it takes the same resolved
  # version and uploads only once that docling-rs is on PyPI. A separate
  # PyPI project: its trusted publisher (this workflow, environment `pypi`)
  # is configured once on pypi.org — docs/MCP_REGISTRIES.md.
  mcp-launcher:
    name: docling-rs-mcp launcher
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Resolve version and pin docling-rs
        id: v
        shell: bash
        working-directory: crates/docling-py/mcp
        run: |
          v="${{ inputs.version }}"
          if [ -z "$v" ] && [ -n "${{ inputs.tag }}" ]; then v="${{ inputs.tag }}"; v="${v#v}"; fi
          if [ -z "$v" ]; then
            v="$(grep -m1 '^version = ' ../../../Cargo.toml | sed -E 's/.*"([^"]+)".*/\1/')"
          fi
          sed -i -E "0,/^version = \".*\"/s//version = \"$v\"/" pyproject.toml
          sed -i -E "s/\"docling-rs==[^\"]*\"/\"docling-rs==$v\"/" pyproject.toml
          grep -q "\"docling-rs==$v\"" pyproject.toml
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "Building docling-rs-mcp $v (pins docling-rs==$v)"

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Build sdist + wheel
        run: |
          python -m pip install build
          python -m build crates/docling-py/mcp --outdir mcp-dist

      - uses: actions/upload-artifact@v7
        with:
          name: mcp-launcher
          path: mcp-dist/*
          if-no-files-found: error

  publish-mcp-launcher:
    name: publish docling-rs-mcp to PyPI
    needs: [publish, mcp-launcher]
    if: ${{ !cancelled() && needs.publish.result == 'success' && needs.mcp-launcher.result == 'success' }}
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/docling-rs-mcp
    permissions:
      id-token: write
    steps:
      - name: Download the launcher
        uses: actions/download-artifact@v8
        with:
          name: mcp-launcher
          path: dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
          attestations: true
          skip-existing: true

  # `langchain-docling-rs`: the LangChain integration under the
  # `langchain-<provider>` name LangChain's integration listing expects. Like
  # the MCP launcher it has no code of its own — it pins this run's docling-rs
  # (whose wheels carry `docling_rs.langchain`) and re-exports it — so it
  # takes the same resolved version and uploads only once that docling-rs is
  # on PyPI. A separate PyPI project: its trusted publisher (this workflow,
  # environment `pypi`) is configured once on pypi.org.
  langchain-shim:
    name: langchain-docling-rs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      # A re-run for a tag older than the package (`inputs.tag`, e.g. the
      # release it first ships with) checks out a tree without
      # `crates/docling-py/langchain`. The package has no code of its own —
      # only the docling-rs pin matters — so take the directory from the ref
      # the workflow was dispatched from (`github.sha`) in that case.
      - name: Package source
        shell: bash
        run: |
          if [ ! -d crates/docling-py/langchain ]; then
            echo "crates/docling-py/langchain is not in the checked-out ref; taking it from ${GITHUB_SHA}"
            git fetch --depth=1 origin "${GITHUB_SHA}"
            git checkout "${GITHUB_SHA}" -- crates/docling-py/langchain
          fi
          test -f crates/docling-py/langchain/pyproject.toml

      - name: Resolve version and pin docling-rs
        shell: bash
        working-directory: crates/docling-py/langchain
        run: |
          v="${{ inputs.version }}"
          if [ -z "$v" ] && [ -n "${{ inputs.tag }}" ]; then v="${{ inputs.tag }}"; v="${v#v}"; fi
          if [ -z "$v" ]; then
            v="$(grep -m1 '^version = ' ../../../Cargo.toml | sed -E 's/.*"([^"]+)".*/\1/')"
          fi
          sed -i -E "0,/^version = \".*\"/s//version = \"$v\"/" pyproject.toml
          sed -i -E "s/\"docling-rs\[langchain\][^\"]*\"/\"docling-rs[langchain]==$v\"/" pyproject.toml
          grep -q "\"docling-rs\[langchain\]==$v\"" pyproject.toml
          echo "Building langchain-docling-rs $v (pins docling-rs[langchain]==$v)"

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Build sdist + wheel
        run: |
          python -m pip install build
          python -m build crates/docling-py/langchain --outdir langchain-dist

      - uses: actions/upload-artifact@v7
        with:
          name: langchain-shim
          path: langchain-dist/*
          if-no-files-found: error

  publish-langchain-shim:
    name: publish langchain-docling-rs to PyPI
    needs: [publish, langchain-shim]
    if: ${{ !cancelled() && needs.publish.result == 'success' && needs.langchain-shim.result == 'success' }}
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/langchain-docling-rs
    permissions:
      id-token: write
    steps:
      - name: Download the package
        uses: actions/download-artifact@v8
        with:
          name: langchain-shim
          path: dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
          attestations: true
          skip-existing: true

  # `llama-index-readers-docling-rs`: the LlamaIndex reader under the
  # `llama_index.readers.<name>` namespace, published from here because
  # LlamaIndex's monorepo no longer takes new integration packages. Like the
  # two above it has no code of its own — it pins this run's docling-rs
  # (whose wheels carry `docling_rs.llamaindex`) and re-exports it. A
  # separate PyPI project with its trusted publisher configured once on
  # pypi.org.
  llamaindex-reader:
    name: llama-index-readers-docling-rs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      # The directory is taken from the dispatched ref when the checked-out
      # tag lacks it — or has it in an older, unpublishable shape (v2.35.0
      # carries the pre-publishing skeleton without the version pin).
      - name: Package source
        shell: bash
        run: |
          if ! grep -q '"docling-rs\[llamaindex\]==' crates/docling-py/llamaindex/pyproject.toml 2>/dev/null; then
            echo "crates/docling-py/llamaindex is missing or predates publishing in the checked-out ref; taking it from ${GITHUB_SHA}"
            git fetch --depth=1 origin "${GITHUB_SHA}"
            git checkout "${GITHUB_SHA}" -- crates/docling-py/llamaindex
          fi
          grep -q '"docling-rs\[llamaindex\]==' crates/docling-py/llamaindex/pyproject.toml

      - name: Resolve version and pin docling-rs
        shell: bash
        working-directory: crates/docling-py/llamaindex
        run: |
          v="${{ inputs.version }}"
          if [ -z "$v" ] && [ -n "${{ inputs.tag }}" ]; then v="${{ inputs.tag }}"; v="${v#v}"; fi
          if [ -z "$v" ]; then
            v="$(grep -m1 '^version = ' ../../../Cargo.toml | sed -E 's/.*"([^"]+)".*/\1/')"
          fi
          sed -i -E "0,/^version = \".*\"/s//version = \"$v\"/" pyproject.toml
          sed -i -E "s/\"docling-rs\[llamaindex\][^\"]*\"/\"docling-rs[llamaindex]==$v\"/" pyproject.toml
          grep -q "\"docling-rs\[llamaindex\]==$v\"" pyproject.toml
          echo "Building llama-index-readers-docling-rs $v (pins docling-rs[llamaindex]==$v)"

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Build sdist + wheel
        run: |
          python -m pip install build
          python -m build crates/docling-py/llamaindex --outdir llamaindex-dist

      - uses: actions/upload-artifact@v7
        with:
          name: llamaindex-reader
          path: llamaindex-dist/*
          if-no-files-found: error

  publish-llamaindex-reader:
    name: publish llama-index-readers-docling-rs to PyPI
    needs: [publish, llamaindex-reader]
    if: ${{ !cancelled() && needs.publish.result == 'success' && needs.llamaindex-reader.result == 'success' }}
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/llama-index-readers-docling-rs
    permissions:
      id-token: write
    steps:
      - name: Download the package
        uses: actions/download-artifact@v8
        with:
          name: llamaindex-reader
          path: dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
          attestations: true
          skip-existing: true

  # The MCP catalogs list the launcher at this version (#669) — the official
  # registry's server.json and Smithery's bundle — so their entries follow a
  # release tag's PyPI publish, not the GitHub Release.
  mcp-registry:
    name: MCP catalogs
    needs: [mcp-launcher, publish-mcp-launcher]
    if: ${{ !cancelled() && needs.publish-mcp-launcher.result == 'success' && (startsWith(inputs.tag, 'v') || startsWith(github.ref, 'refs/tags/v')) }}
    permissions:
      contents: write # the bundle job attaches the .mcpb to the release
      id-token: write
    uses: ./.github/workflows/mcp-registry.yml
    with:
      version: ${{ needs.mcp-launcher.outputs.version }}
    secrets:
      SMITHERY_API_KEY: ${{ secrets.SMITHERY_API_KEY }}
