# Publish the `docling.rs` npm package (Node.js / Bun native bindings) for a
# chosen release. The package is a native N-API addon, so it can't be a one-line
# `npm publish`: it's built on a matrix of native runners (one per OS/arch),
# each producing a platform `.node`, then a publish job assembles the main
# package plus per-platform `optionalDependencies` (docling.rs-<triple>) via
# napi-rs and publishes them all.
#
# Trigger: manual dispatch only. Like pypi-publish.yml, a version tag (one
# per merge) does NOT publish to npm; the maintainer picks the
# releases worth publishing — release.yml runs this with PyPI, the images and
# the CLI binaries; alone, it repairs a failed npm channel:
#
#     gh workflow run npm-publish.yml -f tag=v2.23.0
#
# `tag` checks the release out and publishes its version; blank builds the
# latest master (the version in the workspace Cargo.toml), `version`
# overrides either. `cuda` (on by default) adds `docling.rs-cuda`. Every
# publish job skips a version that is already on npm, so re-runs are safe.
#
# Authentication is npm Trusted Publishing (OIDC): no NPM_TOKEN secret. Each
# published package — `docling.rs`, every `docling.rs-<triple>` platform
# package, `docling.rs-cuda`, `docling.rs-wasm` — must have this repository +
# `npm-publish.yml` configured as its trusted publisher on npmjs.com. The
# publish jobs request `id-token: write` and upgrade to npm >= 11.5.1 (the
# first release that performs the OIDC exchange; the runner's bundled npm 10
# silently falls back to tokens, which npm now rejects as E404).
# npm only offers the trusted-publisher setting on a package that already
# exists, so a NEW platform package (a new napi target, e.g. s390x in #504)
# fails its first CI publish with ENEEDAUTH: publish a placeholder version of
# it once by hand (`npm publish` of a bare package.json, version 0.0.0),
# configure the trusted publisher on it, then re-run this workflow with the
# release tag — the platform packages that did go out are skipped below.
#
# The optional `cuda` input additionally publishes `docling.rs-cuda`
# (issue #74, Linux x64): the CUDA addon + ONNX Runtime provider libraries are
# far past npm's practical size limits, so the binaries go to a GitHub release
# (`npm-cuda-v<version>`) and the npm package is a small JS shim whose
# postinstall downloads + sha256-verifies them — the same
# fetch-at-install-time model onnxruntime-node uses for its CUDA binaries.

name: npm publish

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build (e.g. v0.7.0). Blank = latest master."
        required: false
        default: ""
      version:
        description: "Override the npm version (e.g. 0.7.0). Blank = tag, or workspace version on master."
        required: false
        default: ""
      cuda:
        description: "Also publish docling.rs-cuda (Linux x64: binaries to a GitHub release, npm shim downloads on install)."
        required: false
        type: boolean
        default: true

# Least privilege for GITHUB_TOKEN: the workflow default is checkout-only.
# The publish jobs add `id-token: write` (the npm OIDC exchange) on the job
# itself, and `publish-cuda` also `contents: write` (gh release upload).
permissions:
  contents: read

concurrency:
  group: npm-publish-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

defaults:
  run:
    working-directory: crates/docling-node

jobs:
  build:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.host }}
    # Empty for every entry but linux-x64: the job then runs on the runner.
    container: ${{ matrix.container }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Built in the manylinux_2_28 image, like the PyPI wheels: a plain
          # runner links the addon against its own glibc and libstdc++, and
          # ort's prebuilt static ONNX Runtime needs GCC 13's libstdc++
          # (`_M_replace_cold`). A cdylib links with that symbol undefined, so
          # the ubuntu-22.04 build loaded only where the *system* libstdc++ is
          # GCC 13+ — not even on the runner that built it. The image's
          # gcc-toolset links such newer libstdc++ symbols statically
          # (libstdc++_nonshared.a) and links against glibc 2.28, so the addon
          # loads on RHEL 8 / Debian 10 era systems and newer. Its glibc 2.38
          # `__isoc23_strto*` references are defined by docling-onnx (#745).
          - target: x86_64-unknown-linux-gnu
            host: ubuntu-24.04
            container: quay.io/pypa/manylinux_2_28_x86_64
          # GitHub-hosted ARM64 Linux runner (native — avoids cross-compiling the
          # ONNX/ort build). Requires the arm64 runner image to be available.
          - target: aarch64-unknown-linux-gnu
            host: ubuntu-24.04-arm
          # Apple Silicon (#816), native on the hosted `macos-15` runner (`macos-14`
          # retired 2026-11-02, actions/runner-images#13518) —
          # the same runner ci.yml's coreml check job uses; the "macOS runners
          # are blocked" note this matrix carried dated from the repository's
          # previous home. The triple is also listed in package.json's
          # `napi.triples.additional`: that is where `napi build --platform`
          # takes the loader's platform branches from and `napi
          # create-npm-dir` the platform packages (`docling.rs-darwin-arm64` —
          # a NEW package: its first publish needs the placeholder + trusted
          # publisher dance the header describes, else ENEEDAUTH).
          # Intel macs are not prebuilt: pyke ships no `x86_64-apple-darwin`
          # ONNX Runtime, so an Intel addon is an `ort-load-dynamic` build like
          # s390x (see cli-binaries.yml's header). The addon declares macOS 13
          # (`macos_min`), what the prebuilt ONNX Runtime objects are compiled
          # for; docling-onnx's build.rs links the compiler-rt builtins the
          # CoreML-enabled ONNX Runtime needs under thin LTO.
          - target: aarch64-apple-darwin
            host: macos-15
            macos_min: "13.0"
          - target: x86_64-pc-windows-msvc
            host: windows-latest
          # IBM Z (#504): cross-compiled with cargo-zigbuild against glibc
          # 2.28 (the distro cross toolchain would pin the addon to its 2.39
          # sysroot and shut out RHEL 8/9 mainframes; napi's own `--zig` has
          # a target allowlist without s390x) and `ort-load-dynamic` — pyke
          # ships no ONNX Runtime for s390x, the addon dlopens the one
          # download_dependencies.sh fetches into .models/onnxruntime/ on an
          # s390x host. The cdylib is renamed the way napi names it,
          # docling-rs.linux-s390x-gnu.node, so `napi artifacts` files it into
          # the docling.rs-linux-s390x-gnu platform package (the loader has
          # the s390x branch). `cross` is the binutils prefix used to strip.
          - target: s390x-unknown-linux-gnu
            host: ubuntu-24.04
            cross: s390x-linux-gnu
            zig: true
            features: ort-load-dynamic
    env:
      # rustc, clang and napi read it on Apple targets (the addon's minimum
      # macOS version); unset on the other hosts.
      MACOSX_DEPLOYMENT_TARGET: ${{ matrix.macos_min }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      # rustup is preinstalled on GitHub-hosted runners (Linux, macOS, Windows);
      # use it directly — the docling-project org allowlists only GitHub-owned /
      # vetted actions, not marketplace toolchain actions.
      # The manylinux container has no Rust: install rustup there first.
      - name: Install Rust (stable)
        shell: bash
        run: |
          if ! command -v rustup >/dev/null; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none
            export PATH="$HOME/.cargo/bin:$PATH"
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          fi
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add ${{ matrix.target }}

      # cargo-zigbuild + zig (both as wheels) as the cross C compiler/linker;
      # the target's binutils only for `strip`, which the host's cannot do on
      # a foreign ELF.
      - name: Install cargo-zigbuild and the target binutils
        if: matrix.zig
        shell: bash
        run: |
          python3 -m pip install --user --break-system-packages ziglang cargo-zigbuild
          cargo zigbuild --help >/dev/null
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends binutils-${{ matrix.cross }}

      # One workspace, key the cache per target so the 5 jobs don't collide.
      # The container build gets its own key: a `target/` restored from a
      # runner build would carry C objects (build scripts' `cc`) compiled
      # against the runner's newer glibc headers into the 2.28 link.
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-cargo-${{ matrix.target }}${{ matrix.container && '-manylinux_2_28' || '' }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-${{ matrix.target }}${{ matrix.container && '-manylinux_2_28' || '' }}-

      - uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Install napi CLI
        run: npm install

      # Native addon + the JS loader / d.ts. `--strip` keeps the (ONNX-linked)
      # binary as small as possible (on macOS napi runs `strip -x`, which keeps
      # the exported symbols a Mach-O dylib needs); strip isn't available
      # under MSVC, so the Windows build omits it.
      # `--strip` runs the host `strip` on the cross-built s390x addon, which
      # cannot read it: the cross build strips with the target's binutils
      # afterwards.
      - name: Build (unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          features="${{ matrix.features }}"
          if [ -n "${{ matrix.zig }}" ]; then
            cargo zigbuild --release --locked -p docling-node --target ${{ matrix.target }}.2.28 ${features:+--features $features}
            cp ../../target/${{ matrix.target }}/release/libdocling_node.so docling-rs.linux-s390x-gnu.node
            ${{ matrix.cross }}-strip docling-rs.*.node
          else
            npx napi build --platform --release --strip --target ${{ matrix.target }} --js native.js --dts native.d.ts ${features:+--features $features}
          fi

      # Fail the build, before anything is published, when the addon would not
      # load at its glibc floor. A cdylib links with undefined symbols, so a
      # symbol the floor's glibc / libstdc++ lacks (GCC 13's `_M_replace_cold`,
      # glibc 2.38's `__isoc23_strtol`, #745) otherwise only fails at the
      # user's `require`. Such a symbol shows up unversioned; Node's own API
      # (`napi_*`, `node_api_*`, libuv) is the only legitimate one. Then load
      # it with LD_BIND_NOW, since Node dlopens lazily and would bind a
      # missing function only at its first call. In the manylinux container
      # that load runs at the floor itself (glibc 2.28, GCC 8 libstdc++).
      # The s390x cross build is skipped: it dlopens ONNX Runtime
      # (`ort-load-dynamic`) and is not runnable here.
      - name: Check the glibc floor
        if: runner.os == 'Linux' && !matrix.zig
        shell: bash
        run: |
          addon="$(ls docling-rs.*.node)"
          unresolved="$(objdump -T "$addon" \
            | awk '/\*UND\*/ && $2 != "w" && $0 !~ /(GLIBC|GLIBCXX|CXXABI|GCC)_[0-9]/ {print $NF}' \
            | grep -Ev '^(napi_|node_api_|uv_)' || true)"
          if [ -n "$unresolved" ]; then
            echo "::error::$addon has symbols no system library provides at its floor:"
            echo "$unresolved"
            exit 1
          fi
          echo "glibc floor: $(objdump -T "$addon" | grep -o 'GLIBC_[0-9.]*' | sort -uV | tail -1)"
          echo "libstdc++ floor: $(objdump -T "$addon" | grep -o 'GLIBCXX_[0-9.]*' | sort -uV | tail -1)"
          LD_BIND_NOW=1 node -e "require('./$addon'); console.log('loads: $addon')"

      - name: Build (windows)
        if: runner.os == 'Windows'
        run: npx napi build --platform --release --target ${{ matrix.target }} --js native.js --dts native.d.ts

      - name: Upload prebuilt binary
        uses: actions/upload-artifact@v7
        with:
          name: bindings-${{ matrix.target }}
          path: crates/docling-node/docling-rs.*.node
          if-no-files-found: error

      # The JS loader + types are platform-agnostic; upload them once (from the
      # linux-x64 build) for the publish job to include in the main package.
      - name: Upload JS binding
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        uses: actions/upload-artifact@v7
        with:
          name: js-binding
          path: |
            crates/docling-node/native.js
            crates/docling-node/native.d.ts
          if-no-files-found: error

  publish:
    name: publish to npm
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm trusted publishing (OIDC)
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      # No registry-url: setup-node would write an .npmrc that reads
      # $NODE_AUTH_TOKEN, and trusted publishing sends no token — npm errors
      # on the unset variable. The default registry is npmjs.org anyway.
      - uses: actions/setup-node@v7
        with:
          node-version: 20

      # The runner's bundled npm (10.x) predates trusted publishing; the OIDC
      # exchange needs npm 11.5.1+. `napi prepublish` shells out to `npm
      # publish` per platform package, so the global upgrade covers those too.
      - name: Upgrade npm for trusted publishing
        run: npm install -g npm@^11.5.1 && npm --version

      - name: Install napi CLI
        run: npm install

      # Prebuilt binaries → artifacts/<name>/docling-rs.<triple>.node
      - name: Download prebuilt binaries
        uses: actions/download-artifact@v8
        with:
          pattern: bindings-*
          path: crates/docling-node/artifacts

      # The JS loader + types → the package root.
      - name: Download JS binding
        uses: actions/download-artifact@v8
        with:
          name: js-binding
          path: crates/docling-node

      # Version = the explicit override, else the selected tag (sans leading `v`),
      # else the workspace version from the root Cargo.toml (latest-master run).
      - name: Resolve version
        id: ver
        run: |
          v="${{ inputs.version }}"
          if [ -z "$v" ]; then
            if [ -n "${{ inputs.tag }}" ]; then
              v="${{ inputs.tag }}"; v="${v#v}"
            else
              v="$(grep -m1 '^version = ' ../../Cargo.toml | sed -E 's/.*"([^"]+)".*/\1/')"
            fi
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "Publishing docling.rs@$v (ref: ${{ inputs.tag || github.ref }})"

      # Skip cleanly if this version is already on npm (idempotent re-runs).
      - name: Check if already published
        id: check
        run: |
          v="${{ steps.ver.outputs.version }}"
          if npm view "docling.rs@$v" version >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "docling.rs@$v is already on npm — skipping."
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set package version
        if: steps.check.outputs.published == 'false'
        run: npm version "${{ steps.ver.outputs.version }}" --no-git-tag-version --allow-same-version

      # Create the per-platform package dirs and move each prebuilt .node into
      # its dir. `npm publish` then runs `prepublishOnly` (napi prepublish), which
      # publishes the docling.rs-<triple> packages and wires them into the main
      # package's optionalDependencies before the main package is published.
      - name: Assemble platform packages
        if: steps.check.outputs.published == 'false'
        run: |
          npx napi create-npm-dir -t .
          npx napi artifacts --dir artifacts

      # A re-run after a partial publish: `napi prepublish` publishes every
      # platform package unconditionally, so one that made it to npm last
      # time (`docling.rs-linux-x64-gnu@1.87.0` before the brand-new s390x
      # package failed its first publish, ENEEDAUTH) aborts the run with
      # "cannot publish over the previously published version" — and the
      # main package never goes out. napi skips a platform dir whose `.node`
      # is missing, so dropping the binary of each already-published package
      # makes the re-run publish only what is left; the optionalDependencies
      # wiring is unaffected.
      - name: Skip platform packages already on npm
        if: steps.check.outputs.published == 'false'
        run: |
          for dir in npm/*/; do
            name=$(node -p "require('./${dir}package.json').name")
            ver=$(node -p "require('./${dir}package.json').version")
            if npm view "$name@$ver" version >/dev/null 2>&1; then
              echo "$name@$ver is already on npm — skipping."
              rm -f "$dir"*.node
            fi
          done

      - name: Publish
        if: steps.check.outputs.published == 'false'
        run: npm publish --access public

  # docling.rs-cuda (issue #74): CUDA addon binaries → GitHub release, small
  # npm shim with a postinstall downloader → npm. Self-contained (doesn't need
  # the CPU matrix): build with the cuda feature, upload the gzipped .node +
  # ONNX Runtime provider libraries + sha256 manifest to the npm-cuda-v<ver>
  # release, then validate the packed shim by actually installing it (its
  # postinstall pulls from that very release) and converting on the (GPU-less)
  # runner — the auto→CPU fallback keeps that meaningful — before publishing.
  #
  # ubuntu-24.04, not the manylinux container: the CUDA ONNX Runtime static
  # binaries carry glibc-2.38 symbols (same floor as the docling-rs-cuda
  # Python wheel — see pypi-publish.yml's wheel-cuda job).
  publish-cuda:
    name: publish docling.rs-cuda
    # The `cuda` input, on by default; `-f cuda=false` skips it.
    if: inputs.cuda
    runs-on: ubuntu-24.04
    permissions:
      contents: write # gh release create/upload
      id-token: write # npm trusted publishing (OIDC)
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Install Rust (stable)
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-cargo-cuda-node-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-cuda-node-

      # No registry-url — see the publish job: trusted publishing sends no
      # token, and setup-node's .npmrc would read an unset $NODE_AUTH_TOKEN.
      - uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Upgrade npm for trusted publishing
        run: npm install -g npm@^11.5.1 && npm --version

      - name: Install napi CLI
        run: npm install

      # Same resolution as the publish job — the two packages must agree.
      - name: Resolve version
        id: ver
        run: |
          v="${{ inputs.version }}"
          if [ -z "$v" ]; then
            if [ -n "${{ inputs.tag }}" ]; then
              v="${{ inputs.tag }}"; v="${v#v}"
            else
              v="$(grep -m1 '^version = ' ../../Cargo.toml | sed -E 's/.*"([^"]+)".*/\1/')"
            fi
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"
          echo "Publishing docling.rs-cuda@$v (ref: ${{ inputs.tag || github.ref }})"

      - name: Check if already published
        id: check
        run: |
          v="${{ steps.ver.outputs.version }}"
          if npm view "docling.rs-cuda@$v" version >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "docling.rs-cuda@$v is already on npm — skipping."
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set package version
        if: steps.check.outputs.published == 'false'
        run: npm version "${{ steps.ver.outputs.version }}" --no-git-tag-version --allow-same-version

      # $ORIGIN rpath: ONNX Runtime dlopens the provider libraries by bare
      # name; the rpath makes it look next to the .node, where postinstall
      # puts them (same mechanism as the Python CUDA wheel).
      - name: Build CUDA addon
        if: steps.check.outputs.published == 'false'
        run: RUSTFLAGS='-C link-arg=-Wl,-rpath,$ORIGIN' npx napi build --platform --release --strip --features cuda --js native.js --dts native.d.ts

      # manifest.json carries sha256 of the UNCOMPRESSED files — postinstall
      # verifies after gunzip, catching truncated downloads and bad mirrors.
      # `cp -L`: ort's copy-dylibs leaves symlinks into the download cache.
      - name: Package release assets
        if: steps.check.outputs.published == 'false'
        run: |
          mkdir -p cuda/release-assets
          cp -L ../../target/release/libonnxruntime_providers_shared.so \
                ../../target/release/libonnxruntime_providers_cuda.so \
                cuda/release-assets/
          cp docling-rs.linux-x64-gnu.node cuda/release-assets/
          cd cuda/release-assets
          node -e '
            const fs = require("fs"), crypto = require("crypto");
            const m = {};
            for (const f of fs.readdirSync(".")) {
              m[f] = crypto.createHash("sha256").update(fs.readFileSync(f)).digest("hex");
            }
            fs.writeFileSync("manifest.json", JSON.stringify(m, null, 2));
          '
          gzip -9 docling-rs.linux-x64-gnu.node libonnxruntime_providers_shared.so libonnxruntime_providers_cuda.so
          ls -la

      - name: Upload to GitHub release
        if: steps.check.outputs.published == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="npm-cuda-v${{ steps.ver.outputs.version }}"
          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release upload "$TAG" cuda/release-assets/* --repo "${{ github.repository }}" --clobber
          else
            # Never GitHub's "latest": that is the vX.Y.Z release whose CLI
            # binaries install.sh downloads (release.yml marks it, #707).
            gh release create "$TAG" cuda/release-assets/* \
              --repo "${{ github.repository }}" \
              --title "docling.rs-cuda ${{ steps.ver.outputs.version }} (npm binaries)" \
              --notes "CUDA addon binaries for the docling.rs-cuda npm package. Downloaded by its postinstall — not for direct use." \
              --latest=false
          fi

      - name: Assemble npm package
        if: steps.check.outputs.published == 'false'
        run: node cuda/make-package.mjs

      # End-to-end validation before publish: install the packed tarball in a
      # scratch dir (npm runs postinstall → downloads from the release just
      # uploaded, hash-checked) and convert something. Catches a broken
      # loader, a bad manifest, or an unpublishable release *before* npm has
      # an unusable version.
      - name: Validate install from release
        if: steps.check.outputs.published == 'false'
        run: |
          (cd cuda/pkg && npm pack >/dev/null)
          PKG_TGZ="$(ls "$PWD"/cuda/pkg/*.tgz)"
          mkdir -p /tmp/cuda-install-test && cd /tmp/cuda-install-test
          npm init -y >/dev/null
          npm install "$PKG_TGZ"
          node -e '
            const m = require("docling.rs-cuda");
            const r = m.convert({ data: Buffer.from("# GPU shim smoke"), name: "x.md" });
            if (r.status !== "success" || !r.content.startsWith("# GPU shim smoke")) {
              throw new Error("unexpected result: " + JSON.stringify(r));
            }
            console.log("docling.rs-cuda install validated:", JSON.stringify(r.content));
          '

      - name: Publish
        if: steps.check.outputs.published == 'false'
        run: cd cuda/pkg && npm publish --access public

  # docling.rs-wasm: the browser/WebAssembly package (no native matrix — one
  # Linux runner compiles wasm32-unknown-unknown and publishes). Same
  # ref-selection and idempotency as the main package: builds the checked-out
  # workspace version, skips cleanly when that version is already on npm.
  publish-wasm:
    name: publish docling.rs-wasm
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm trusted publishing (OIDC)
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Install Rust (stable + wasm32 target)
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add wasm32-unknown-unknown

      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            ~/.cargo/bin
            target
          key: ${{ runner.os }}-cargo-v2-wasm-npm-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-v2-wasm-npm-

      # No registry-url — see the publish job: trusted publishing sends no
      # token, and setup-node's .npmrc would read an unset $NODE_AUTH_TOKEN.
      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Upgrade npm for trusted publishing
        run: npm install -g npm@^11.5.1 && npm --version

      - name: Install wasm-bindgen-cli (pinned to Cargo.lock)
        run: |
          # A CLI/crate version mismatch produces glue the module rejects at
          # load time — pin to the workspace's wasm-bindgen (same as pages.yml).
          version=$(cargo metadata --format-version 1 --locked \
            | python3 -c 'import json,sys; print(next(p["version"] for p in json.load(sys.stdin)["packages"] if p["name"]=="wasm-bindgen"))')
          echo "wasm-bindgen $version"
          command -v wasm-bindgen >/dev/null && [ "$(wasm-bindgen --version)" = "wasm-bindgen $version" ] \
            || cargo install wasm-bindgen-cli --version "$version" --locked

      - name: Build the package
        run: bash scripts/ci/build_wasm_pkg.sh target/npm-wasm

      # Skip cleanly if this version is already on npm (idempotent re-runs).
      - name: Check if already published
        id: wcheck
        run: |
          v="$(grep -m1 '^version = ' Cargo.toml | sed -E 's/.*"([^"]+)".*/\1/')"
          echo "version=$v" >> "$GITHUB_OUTPUT"
          if npm view "docling.rs-wasm@$v" version >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "docling.rs-wasm@$v is already on npm — skipping."
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      # Load the module in Node off the packed tarball (exactly what npm will
      # serve) and convert a real file before publishing anything.
      - name: Validate the packed package
        if: steps.wcheck.outputs.published == 'false'
        run: |
          (cd target/npm-wasm && npm pack >/dev/null)
          mkdir -p /tmp/wasm-check && tar -xzf target/npm-wasm/*.tgz -C /tmp/wasm-check --strip-components=1
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const m = await import("/tmp/wasm-check/web/docling_wasm.js");
            await m.default({ module_or_path: readFileSync("/tmp/wasm-check/web/docling_wasm_bg.wasm") });
            const html = new TextEncoder().encode("<html><body><h1>T</h1><p>ok</p></body></html>");
            const md = m.convert(html, "t.html", "md");
            if (!md.includes("# T")) throw new Error("bad output: " + md);
            console.log("docling.rs-wasm@" + m.version() + " converts: " + JSON.stringify(md));
          '

      - name: Publish
        if: steps.wcheck.outputs.published == 'false'
        run: cd target/npm-wasm && npm publish --access public
