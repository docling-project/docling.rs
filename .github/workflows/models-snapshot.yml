# Freeze a models release into an immutable content-addressed copy
# (scripts/ci/models_snapshot.sh, #951). Since #965 every workflow that
# uploads into the rolling release (publish-models.yml,
# docling-parse-render.yml, onnxruntime-s390x.yml, models-manifest.yml)
# ends by running the same script, so this dispatch is the repair path —
# a publish whose last step failed, a release changed by hand:
#
#   gh workflow run models-snapshot.yml                   # tag = models-v1
#   gh workflow run models-snapshot.yml -f tag=models-v2

name: models snapshot

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Rolling models release whose current assets to freeze."
        required: false
        default: "models-v1"

permissions:
  contents: write # gh release create

jobs:
  snapshot:
    name: snapshot of ${{ inputs.tag }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7
      - run: scripts/ci/models_snapshot.sh "${{ inputs.tag }}"
