# Export the RT-DETR layout model + TableFormer to ONNX, re-host the OCR model
# (and pdfium, for the opt-in `pdfium` feature's oracle tests), and publish
# everything as GitHub Release assets, so
# `scripts/install/download_dependencies.sh` can fetch the whole PDF/image ML stack
# from a single host (this repo's releases) with zero configuration.
#
# The layout model and TableFormer are PyTorch→ONNX *format conversions* of
# docling-project's own models (Apache-2.0 / CDLA-Permissive-2.0 — see
# docs/MODELS_NOTICE.md); no weights are retrained here. The `*_int8` assets are
# post-training quantizations of those same exports (scripts/install/quantize_models.py
# — a numeric re-encoding of the weights, no retraining; conformance-validated
# in PDF_PERFORMANCE.md). pdfium and the OCR model are re-hosted third-party
# binaries, unmodified, from their own public releases — mirrored here only so
# `download_dependencies.sh` needs one host instead of three. Everything a
# *default* install fetches is mirrored (both OCR pairs, Whisper tiny, the
# chunk tokenizer, the picture classifier): third-party hosts answer 429 to
# shared CI egress, which used to break container builds outright. Only the
# opt-in extras (--asr-model presets, --embed) still come from upstream.
#
# Trigger: manual only (workflow_dispatch) — it installs torch and exports two
# models, several GB and 10-20 minutes, not something to run on every push.
# Re-running with the same tag re-uploads (clobbers) matching asset names, so
# it's safe to retry after fixing a failed export; assets this run did not
# stage are pruned, except those other workflows own (see "Prune stale
# release assets").
#
#   gh workflow run publish-models.yml                    # tag = models-v1
#   gh workflow run publish-models.yml -f tag=models-v2    # a future re-export

name: publish models

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to publish/update (bump only when the export itself changes)."
        required: false
        default: "models-v1"

permissions:
  contents: write # create the release + upload assets

jobs:
  publish-models:
    name: export + publish
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      # --- layout model (required) --------------------------------------
      - name: Install layout export deps
        run: pip install --upgrade pip && pip install torch transformers onnx

      - name: Export layout model
        run: python scripts/install/export_layout.py .models/layout_heron.onnx

      # --- TableFormer (optional — a failure here doesn't block layout) ---
      - name: Install TableFormer export deps
        continue-on-error: true
        id: tf-deps
        run: pip install docling_ibm_models onnxscript onnxruntime huggingface_hub opencv-python-headless

      - name: Export TableFormer
        if: steps.tf-deps.outcome == 'success'
        continue-on-error: true
        id: tf-export
        run: python scripts/install/export_tableformer.py .models/tableformer

      # --- INT8 quantization (optional — fp32 assets publish regardless) ---
      # Conv-only static INT8 of the layout model (calibrated on the repo's PDF
      # corpus, checked out above) + dynamic INT8 of the TableFormer decoder.
      # quantize_models.py SELF-VALIDATES the layout quant (fp32-vs-int8
      # agreement gate over the calibration corpus; zero tolerance for lost
      # tables) and deletes its output on failure — so a bad quant simply
      # isn't staged and the release stays fp32-only for that model
      # (download_dependencies.sh treats every int8 asset as optional). The
      # quant is deterministic given the fp32 input, and the export upstream
      # of it is stable too (two exports of the same weights differ only by
      # ~1e-7 in the constant-folded BatchNorm scales). What used to flip the
      # gate between runs was the RUNNER'S CPU: it runs int8 inference, and
      # the previous recipe's full-range weights saturated int16 in the AVX2
      # kernel on runners without VNNI (83 of 505 detections lost there, 1
      # on a VNNI box with the same input).
      # quantize_models.py now emits 7-bit weights and checks that range
      # hardware-independently, so the outcome no longer depends on which
      # machine the job landed on. Deps pinned to the validated set. Two
      # separate steps so a TableFormer export failure doesn't block the
      # layout int8.
      - name: Install quantization deps
        continue-on-error: true
        id: quant-deps
        run: pip install onnx==1.22.0 onnxruntime==1.27.0 sympy==1.14.0 pypdfium2==5.12.0 pillow==12.3.0 numpy==2.4.6

      - name: Quantize layout model (static INT8, conv-only)
        if: steps.quant-deps.outcome == 'success'
        continue-on-error: true
        run: |
          # The accuracy gate infers on this CPU, so record which int8 kernel
          # it used — VNNI vs plain AVX2 is the first thing to check if the
          # gate ever disagrees with a local run again.
          grep -m1 '^model name' /proc/cpuinfo || true
          echo "int8 ISA: $(grep -o -m1 'avx512_vnni\|avx_vnni\|avx2' /proc/cpuinfo | sort -u | tr '\n' ' ')"
          python scripts/install/quantize_models.py layout

      - name: Quantize TableFormer decoder (dynamic INT8)
        if: steps.quant-deps.outcome == 'success' && steps.tf-export.outcome == 'success'
        continue-on-error: true
        run: python scripts/install/quantize_models.py tableformer-decoder

      # fp16-weight repack of the encoder (#374): a size lever, not a
      # quantization — fp32 compute, ~half the download. Self-gated on the
      # calibration pages (deletes its output on a fidelity miss, so the
      # release simply ships without it).
      - name: Repack TableFormer encoder (fp16 weights)
        if: steps.quant-deps.outcome == 'success' && steps.tf-export.outcome == 'success'
        continue-on-error: true
        run: python scripts/install/quantize_models.py tableformer-encoder-fp16

      # --- CodeFormula VLM (optional — the enrichment models are opt-in) ---
      # CodeFormulaV2 (Idefics3/SmolVLM-class, Apache-2.0) exported to the
      # three-graph ONNX set the Rust `--enrich-code`/`--enrich-formula`
      # passes run; the export script verifies the graphs argmax-identical to
      # transformers.generate before writing them.
      - name: Install CodeFormula export deps
        continue-on-error: true
        id: cf-deps
        run: pip install "transformers>=4.46" onnxruntime pillow huggingface_hub

      - name: Export CodeFormula
        if: steps.cf-deps.outcome == 'success'
        continue-on-error: true
        id: cf-export
        run: python scripts/install/export_code_formula.py .models/code_formula

      - name: Quantize CodeFormula decoder (dynamic INT8)
        if: steps.cf-export.outcome == 'success' && steps.quant-deps.outcome == 'success'
        continue-on-error: true
        run: python scripts/install/quantize_models.py code-formula-decoder

      # --- pdfium + OCR + chunk tokenizer (re-hosted third-party assets) ---
      # The tokenizer is all-MiniLM-L6-v2's tokenizer.json (Apache-2.0), the
      # default docling's HybridChunker counts tokens with; re-hosted so the
      # hybrid chunker works out of the box after download_dependencies.sh.
      - name: Fetch pdfium + OCR + ASR + chunk tokenizer assets
        run: |
          mkdir -p third-party third-party/asr
          # Same backoff download_dependencies.sh uses: Hugging Face and
          # raw.githubusercontent answer 429 to shared CI egress often enough
          # to fail an unretried fetch, and GitHub's release-asset CDN has
          # answered 504 for a quarter of a minute straight.
          RETRY="--retry 8 --connect-timeout 30"
          curl -fsSL $RETRY -o /tmp/pdfium.tgz \
            "https://github.com/bblanchon/pdfium-binaries/releases/latest/download/pdfium-linux-x64.tgz"
          tar -xzf /tmp/pdfium.tgz -C third-party
          curl -fsSL $RETRY -o third-party/ocr_rec.onnx \
            "https://huggingface.co/SWHL/RapidOCR/resolve/main/PP-OCRv3/ch_PP-OCRv3_rec_infer.onnx"
          curl -fsSL $RETRY -o third-party/ppocr_keys_v1.txt \
            "https://raw.githubusercontent.com/PaddlePaddle/PaddleOCR/main/ppocr/utils/ppocr_keys_v1.txt"
          curl -fsSL $RETRY -o third-party/chunk_tokenizer.json \
            "https://huggingface.co/sentence-transformers/all-MiniLM-L6-v2/resolve/main/tokenizer.json"
          # DocumentFigureClassifier-v2.5 (Apache-2.0) ships its ONNX graph
          # upstream — re-hosted as-is for --enrich-picture-classes.
          curl -fsSL $RETRY -o third-party/picture_classifier.onnx \
            "https://huggingface.co/docling-project/DocumentFigureClassifier-v2.5/resolve/main/model.onnx"
          # English PP-OCRv3 recognition pair — the *runtime default* OCR
          # model (the ch_ pair above is the conformance one). Unmirrored, it
          # was the last required asset a container build pulled from Hugging
          # Face, and a 429 there failed the image publish outright.
          curl -fsSL $RETRY -o third-party/ocr_rec_en.onnx \
            "https://huggingface.co/SWHL/RapidOCR/resolve/main/PP-OCRv3/en_PP-OCRv3_rec_infer.onnx"
          curl -fsSL $RETRY -o third-party/en_dict.txt \
            "https://raw.githubusercontent.com/PaddlePaddle/PaddleOCR/main/ppocr/utils/en_dict.txt"
          # PP-OCRv6 text detector (#429, Apache-2.0): RapidOCR's small DB
          # detector, the one docling's RapidOCR default runs; re-hosted
          # unmodified from RapidOCR's model hub (its SHA256 is pinned there:
          # 090f04abcd9d9a7498bc4ebf677e4cb9bdce1fe4197ddb7e529f1ef44e1ff94f).
          curl -fsSL $RETRY -o third-party/ocr_det.onnx \
            "https://www.modelscope.cn/models/RapidAI/RapidOCR/resolve/v3.9.2/onnx/PP-OCRv6/det/PP-OCRv6_det_small.onnx"
          # PP-OCRv6 recognizer + dictionary (#570, Apache-2.0): RapidOCR's
          # multilingual `PP-OCRv6_rec_small`, the recognizer docling runs for
          # every language and the Rust default when present; re-hosted
          # unmodified (hub SHA256:
          # 6f327246b50388f3c176ae304bd95767ea6dc0c9ae92153ef8cbe210b3c14884).
          curl -fsSL $RETRY -o third-party/ocr_rec_v6.onnx \
            "https://www.modelscope.cn/models/RapidAI/RapidOCR/resolve/v3.9.2/onnx/PP-OCRv6/rec/PP-OCRv6_rec_small.onnx"
          curl -fsSL $RETRY -o third-party/ocr_rec_v6_dict.txt \
            "https://www.modelscope.cn/models/RapidAI/RapidOCR/resolve/v3.9.2/paddle/PP-OCRv6/rec/PP-OCRv6_rec_small/ppocrv6_dict.txt"
          # PP-LCNet text-line orientation classifier (#666, Apache-2.0):
          # RapidOCR's `ch_PP-LCNet_x0_25_textline_ori_cls_mobile`, the 0/180
          # check of `ocr_textline_orientation`; re-hosted unmodified (hub
          # SHA256: 54379ae5174d026780215fc748a7f31910dee36818e63d49e17dc598ecc82df7).
          curl -fsSL $RETRY -o third-party/ocr_textline_ori.onnx \
            "https://www.modelscope.cn/models/RapidAI/RapidOCR/resolve/v3.9.2/onnx/PP-OCRv5/cls/ch_PP-LCNet_x0_25_textline_ori_cls_mobile.onnx"
          echo "54379ae5174d026780215fc748a7f31910dee36818e63d49e17dc598ecc82df7  third-party/ocr_textline_ori.onnx" | sha256sum -c -
          # Whisper tiny (the ASR default, ~150 MB): same reasoning — a
          # default install fetches it, so mirror it here and leave Hugging
          # Face as download_dependencies.sh's fallback host.
          for f in encoder_model decoder_model; do
            curl -fsSL $RETRY -o "third-party/asr/$f.onnx" \
              "https://huggingface.co/onnx-community/whisper-tiny/resolve/main/onnx/$f.onnx"
          done
          curl -fsSL $RETRY -o third-party/asr/vocab.json \
            "https://huggingface.co/onnx-community/whisper-tiny/resolve/main/vocab.json"
          curl -fsSL $RETRY -o third-party/asr/added_tokens.json \
            "https://huggingface.co/onnx-community/whisper-tiny/resolve/main/added_tokens.json"

      # --- stage + publish -------------------------------------------------
      # GitHub release assets can't contain "/", so tableformer/*.onnx is
      # flattened to bare encoder.onnx / decoder.onnx / bbox.onnx (no naming
      # collision with anything else in this release; download_dependencies.sh
      # downloads these exact names). Each file is staged only if the export
      # produced it, including the optional `.onnx.data` external-weights
      # sidecar some exports need above ONNX's ~2GB protobuf limit (currently
      # just the TableFormer decoder, but checked for every file since that's
      # export-size dependent, not fixed).
      - name: Stage release assets
        run: |
          mkdir -p release-assets
          stage() { # <source-path> <asset-name>
            if [ -f "$1" ]; then cp "$1" "release-assets/$2"; fi
            if [ -f "$1.data" ]; then cp "$1.data" "release-assets/$2.data"; fi
          }
          stage third-party/lib/libpdfium.so libpdfium.so
          stage third-party/ocr_rec.onnx ocr_rec.onnx
          stage third-party/ppocr_keys_v1.txt ppocr_keys_v1.txt
          stage third-party/chunk_tokenizer.json chunk_tokenizer.json
          stage .models/layout_heron.onnx layout_heron.onnx
          stage .models/layout_heron_int8.onnx layout_heron_int8.onnx
          stage .models/tableformer/encoder.onnx encoder.onnx
          stage .models/tableformer/encoder_fp16.onnx encoder_fp16.onnx
          stage .models/tableformer/decoder.onnx decoder.onnx
          stage .models/tableformer/decoder_int8.onnx decoder_int8.onnx
          stage .models/tableformer/decoder_kv.onnx decoder_kv.onnx
          # Its per-layer-cache graph (#871) — references decoder_kv.onnx.data.
          stage .models/tableformer/decoder_kv_layers.onnx decoder_kv_layers.onnx
          stage .models/tableformer/decoder_kv_int8.onnx decoder_kv_int8.onnx
          stage .models/tableformer/bbox.onnx bbox.onnx
          stage third-party/picture_classifier.onnx picture_classifier.onnx
          stage third-party/ocr_rec_en.onnx ocr_rec_en.onnx
          stage third-party/en_dict.txt en_dict.txt
          stage third-party/ocr_det.onnx ocr_det.onnx
          stage third-party/ocr_rec_v6.onnx ocr_rec_v6.onnx
          stage third-party/ocr_rec_v6_dict.txt ocr_rec_v6_dict.txt
          stage third-party/ocr_textline_ori.onnx ocr_textline_ori.onnx
          # Whisper tiny flattens with an asr_ prefix (release assets are one
          # flat namespace; download_dependencies.sh maps them back into
          # .models/asr/).
          stage third-party/asr/encoder_model.onnx asr_encoder_model.onnx
          stage third-party/asr/decoder_model.onnx asr_decoder_model.onnx
          stage third-party/asr/vocab.json asr_vocab.json
          stage third-party/asr/added_tokens.json asr_added_tokens.json
          # CodeFormula graphs flatten with a cf_ prefix (release assets are
          # one flat namespace).
          stage .models/code_formula/vision.onnx cf_vision.onnx
          stage .models/code_formula/embed.onnx cf_embed.onnx
          stage .models/code_formula/decoder_kv.onnx cf_decoder_kv.onnx
          stage .models/code_formula/decoder_kv_int8.onnx cf_decoder_kv_int8.onnx
          stage .models/code_formula/tokenizer.json cf_tokenizer.json
          echo "staged:"
          ls -la release-assets/

      - name: Publish release
        run: |
          if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
            gh release upload "$TAG" release-assets/* --repo "${{ github.repository }}" --clobber
          else
            # Never GitHub's "latest": that is the vX.Y.Z release whose CLI
            # binaries install.sh downloads (release.yml marks it, #707).
            gh release create "$TAG" release-assets/* \
              --repo "${{ github.repository }}" \
              --title "docling.rs ML models ($TAG)" \
              --notes-file docs/MODELS_NOTICE.md \
              --latest=false
          fi

      # --- prune stale assets ------------------------------------------------
      # --clobber only overwrites assets whose names match; a re-run that
      # renames or drops an export would leave the old asset behind forever.
      # Keep the release exactly equal to what this run staged: delete every
      # published asset that has no counterpart in release-assets/.
      - name: Prune stale release assets
        run: |
          gh release view "$TAG" --repo "${{ github.repository }}" \
            --json assets --jq '.assets[].name' |
          while IFS= read -r asset; do
            # Other workflows publish into the same release and are not
            # staged here, so their assets are kept: docling-parse-render.yml's
            # per-platform tarballs, and onnxruntime-s390x.yml's runtime
            # (onnxruntime-linux-s390x.tar.gz, #504) — pruning it broke the
            # s390x images, whose smoke test requires the runtime in the image
            # (v1.98.0, after a re-run of this workflow). Keep the patterns in
            # sync with every workflow that uploads into $TAG.
            case "$asset" in
              docling-parse-render-*|onnxruntime-linux-*|SHA256SUMS) continue ;;
            esac
            if [ ! -f "release-assets/$asset" ]; then
              echo "pruning stale asset: $asset"
              gh release delete-asset "$TAG" "$asset" --repo "${{ github.repository }}" --yes
            fi
          done

      # Last: the SHA256SUMS the downloaders verify every asset against,
      # regenerated from the release as it stands after the upload and the
      # prune (scripts/ci/models_manifest.sh — also the last step of the
      # other workflows that upload into this release).
      - name: Regenerate SHA256SUMS
        run: scripts/ci/models_manifest.sh "$TAG"
