# Prebuilt `docling-rs` CLI binaries — and the `docling-ffi` C ABI library
# (#193, cdylib + docling.h) — attached to each published GitHub Release.
# `cargo install docling-cli` means several minutes of compiling on the user's
# machine; a downloadable binary is the first thing launch-day visitors look
# for, and FFI embedders (C#/Go/Java/Swift) get a lib + header instead of a
# full clone-and-build. Runs on manual dispatch for an existing release tag —
# release.yml runs it, with PyPI, npm and the images, for a release the
# maintainer picks, then marks that release GitHub's latest. install.sh
# downloads the binary from the newest release that has it, so the per-merge
# releases ci.yml cuts (no assets, `--latest=false`) and the asset-only
# `npm-cuda-v*` / `models-v*` releases never get in its way (#707).
#
# macOS (#816): Apple Silicon is built natively on the GitHub-hosted
# `macos-15` runner (`macos-14` was retired on 2026-11-02 — its brownouts
# failed the v2.62.0 wheel job; actions/runner-images#13518), the image
# family ci.yml's `check (coreml, macos-latest)` job and
# docling-parse-render.yml's `build mac-arm64` job run on.
# (The "macOS runners are blocked" note this matrix carried until #816 dated
# from the repository's previous home, where the Intel-mac job hung waiting
# for a runner; it never applied to docling-project.) pyke's only
# `aarch64-apple-darwin` ONNX Runtime is the CoreML-enabled build, whose
# Objective-C `@available` checks need clang's compiler-rt builtins
# (`___isPlatformVersionAtLeast`); docling-onnx's build.rs links them, else
# the thin-LTO release link fails on that symbol. The binaries declare
# macOS 13 (`MACOSX_DEPLOYMENT_TARGET` below): the prebuilt ONNX Runtime
# objects are compiled for 13.4. Intel macs are not prebuilt: pyke ships no
# `x86_64-apple-darwin` ONNX Runtime at all (ort-sys's dist.tsv), so an Intel
# build is an `ort-load-dynamic` one like s390x — `dlopen`ing a
# `libonnxruntime.dylib` fetched separately — and the x86_64 hosted runners
# are being retired (`macos-13` is gone, `macos-15-intel` lasts to 2027);
# install.sh has the matching `x86_64` arm of its Darwin case commented out.
# Until then Intel macs `cargo install docling-cli`.
#
# The binaries are the *default* build (CPU; ONNX Runtime statically linked by
# ort's download-binaries, same as every other build of this workspace) —
# plus, on Windows, a second `docling-rs-directml-<tag>-x86_64-pc-windows-msvc.zip`
# (#840): the CLI built with `--features directml` (the GPU on any DirectX 12
# adapter — NVIDIA, AMD, Intel, no CUDA toolkit) and the `DirectML.dll` it
# loads, which must sit next to the exe. A separate asset, not the default,
# because it is +40 MB (the larger ONNX Runtime and the DLL) and a GPU build
# changes the defaults (fp32 models, one page worker); without a usable
# adapter it converts on CPU. No FFI variant: embedders build their own. The
# runtime assets (pdfium + models) stay a separate download —
# scripts/install/download_dependencies.sh — exactly as with a cargo install;
# the CLI prints that instruction when they are missing.
#
# s390x (IBM Z, #504) is cross-compiled from the x86_64 runner with
# cargo-zigbuild against glibc 2.28 (the distro cross toolchain would pin
# the binaries to its 2.39 sysroot and shut out RHEL 8/9 mainframes) and
# built with `ort-load-dynamic`: pyke ships no ONNX Runtime for the target,
# so the binary `dlopen`s a `libonnxruntime.so` found on the machine
# (ORT_DYLIB_PATH, .models/onnxruntime/, the library search path) and,
# without one, converts every format but the ML stages (PDF
# layout/tables/OCR, ASR).

name: cli-binaries

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to build binaries for (e.g. v0.55.0). The assets upload to that release."
        required: true

permissions:
  contents: write # gh release upload

jobs:
  build:
    name: build ${{ matrix.target }}
    runs-on: ${{ matrix.host }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # ubuntu-24.04, not 22.04: ort's prebuilt static onnxruntime is built
          # against GCC-13 libstdc++ (_M_replace_cold) — linking on 22.04 fails
          # with an undefined symbol. (Its glibc 2.38 __isoc23_strto* references
          # no longer matter: docling-onnx's glibc_compat defines them, #745.)
          # Consequence: the shipped binary needs glibc >= 2.38 at runtime
          # (Ubuntu 24.04+, Debian 13+, Fedora 39+); older distros build from
          # source (install.sh verifies the downloaded binary runs and falls
          # back automatically).
          - target: x86_64-unknown-linux-gnu
            host: ubuntu-24.04
          # Native ARM64 Linux runner — avoids cross-compiling the ONNX/ort build.
          - target: aarch64-unknown-linux-gnu
            host: ubuntu-24.04-arm
          - target: x86_64-pc-windows-msvc
            host: windows-latest
          # The DirectML CLI (see the header). `flavor` names the asset, the
          # artifact and the cache; `cli_only` skips the FFI build.
          - target: x86_64-pc-windows-msvc
            host: windows-latest
            features: directml
            flavor: directml
            cli_only: true
          # Apple Silicon, native (see the header for Intel).
          - target: aarch64-apple-darwin
            host: macos-15
            macos_min: "13.0"
          # IBM Z: no native runner, cross-compiled with cargo-zigbuild (see
          # the header). `cross` is the binutils prefix used to strip.
          - target: s390x-unknown-linux-gnu
            host: ubuntu-24.04
            cross: s390x-linux-gnu
            zig: true
            features: ort-load-dynamic
    env:
      TAG: ${{ inputs.tag }}
      # rustc and clang read it on Apple targets (the Mach-O's minimum OS
      # version); unset on the other hosts.
      MACOSX_DEPLOYMENT_TARGET: ${{ matrix.macos_min }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag }}

      # rustup is preinstalled on GitHub-hosted runners; the org allowlists only
      # GitHub-owned / vetted actions, so no marketplace toolchain action.
      - name: Install Rust (stable)
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add ${{ matrix.target }}

      - name: Install cargo-zigbuild and the target binutils
        if: matrix.zig
        shell: bash
        run: |
          python3 -m pip install --user --break-system-packages ziglang cargo-zigbuild
          cargo zigbuild --help >/dev/null
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends binutils-${{ matrix.cross }}

      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: ${{ runner.os }}-cargo-cli-${{ matrix.target }}${{ matrix.flavor && format('-{0}', matrix.flavor) || '' }}-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-cli-${{ matrix.target }}${{ matrix.flavor && format('-{0}', matrix.flavor) || '' }}-

      - name: Build
        shell: bash
        run: |
          features="${{ matrix.features }}"
          if [ -n "${{ matrix.zig }}" ]; then
            build="cargo zigbuild"; target="${{ matrix.target }}.2.28"
          else
            build="cargo build"; target="${{ matrix.target }}"
          fi
          $build --release --locked -p docling-cli --target "$target" ${features:+--features $features}
          [ -n "${{ matrix.cli_only }}" ] && exit 0
          # The C ABI shared library (#193) rides the same job: the docling
          # dependency tree is already compiled, only the thin FFI layer adds.
          $build --release --locked -p docling-ffi --target "$target" ${features:+--features $features}

      - name: Package (unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          strip="${{ matrix.cross && format('{0}-strip', matrix.cross) || 'strip' }}"
          bin="target/${{ matrix.target }}/release/docling-rs"
          "$strip" "$bin"
          tar -czf "docling-rs-$TAG-${{ matrix.target }}.tar.gz" -C "$(dirname "$bin")" docling-rs
          # FFI: the cdylib + the committed cbindgen header. The staticlib is
          # not shipped (it inlines the whole ONNX runtime; static embedders
          # build from source). A cdylib is `.so` on Linux, `.dylib` on
          # macOS — where a bare `strip` would also remove the exported
          # symbols (Mach-O strips everything not kept with `-x`: local
          # symbols only, the way napi-rs strips its addons).
          if [ "$RUNNER_OS" = "macOS" ]; then
            libname="libdocling_ffi.dylib"; strip="strip -x"
          else
            libname="libdocling_ffi.so"
          fi
          lib="target/${{ matrix.target }}/release/$libname"
          $strip "$lib"
          staging=$(mktemp -d)
          cp "$lib" crates/docling-ffi/include/docling.h "$staging/"
          tar -czf "docling-ffi-$TAG-${{ matrix.target }}.tar.gz" -C "$staging" "$libname" docling.h

      - name: Package (windows)
        if: runner.os == 'Windows' && !matrix.flavor
        shell: bash
        run: |
          7z a "docling-rs-$TAG-${{ matrix.target }}.zip" "./target/${{ matrix.target }}/release/docling-rs.exe"
          # dll + MSVC import library + header.
          7z a "docling-ffi-$TAG-${{ matrix.target }}.zip" \
            "./target/${{ matrix.target }}/release/docling_ffi.dll" \
            "./target/${{ matrix.target }}/release/docling_ffi.dll.lib" \
            "./crates/docling-ffi/include/docling.h"

      # The exe + DirectML.dll, which Windows loads from the exe's directory.
      # ort's copy-dylibs leaves it in the target dir, possibly as a symlink
      # into its cache — `cp -L` takes the file.
      - name: Package (windows, directml)
        if: runner.os == 'Windows' && matrix.flavor == 'directml'
        shell: bash
        run: |
          rel="target/${{ matrix.target }}/release"
          dll="$(find "$rel" target/release -maxdepth 2 -iname DirectML.dll 2>/dev/null | head -n1)"
          [ -n "$dll" ] || { echo "::error::DirectML.dll not found next to the build"; exit 1; }
          staging=$(mktemp -d)
          cp -L "$rel/docling-rs.exe" "$dll" "$staging/"
          7z a "docling-rs-directml-$TAG-${{ matrix.target }}.zip" "$staging/docling-rs.exe" "$staging/$(basename "$dll")"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: cli-${{ matrix.target }}${{ matrix.flavor && format('-{0}', matrix.flavor) || '' }}
          path: |
            docling-rs-*
            docling-ffi-*
          if-no-files-found: error

  upload:
    name: attach to release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v7
        with:
          pattern: cli-*
          path: assets
          merge-multiple: true

      # Idempotent: --clobber replaces same-named assets on a re-run.
      - name: Upload to the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: gh release upload "$TAG" assets/* --repo "${{ github.repository }}" --clobber
