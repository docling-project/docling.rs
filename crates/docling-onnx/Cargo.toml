[package]
name = "docling-onnx"
description = "Shared ONNX Runtime execution-provider selection for docling.rs (DOCLING_RS_EP)."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
rust-version.workspace = true

[features]
# copy-dylibs rides along on every GPU feature: the CUDA/TensorRT providers
# are separate shared libraries (libonnxruntime_providers_*.so) that must sit
# next to the binary at runtime — without the copy, registration fails with a
# bare "cannot open shared object file" even on a machine with a working GPU.
cuda = ["ort/cuda", "ort/copy-dylibs"]
tensorrt = ["ort/tensorrt", "ort/copy-dylibs"]
directml = ["ort/directml", "ort/copy-dylibs"]
coreml = ["ort/coreml", "ort/copy-dylibs"]
# XNNPACK is a CPU-class EP (ARM NEON / x86 SIMD kernels), statically linked —
# no provider dylib to copy (#324). NOTE: pyke ships no prebuilt ONNX Runtime
# with the XNNPACK EP (any target), so this feature links only against a
# self-built ONNX Runtime (`ORT_LIB_LOCATION`, onnxruntime built with
# `--use_xnnpack`) — with `download-binaries` the build fails at link time by
# design. Keep it out of CI matrices that rely on downloaded binaries.
xnnpack = ["ort/xnnpack"]
# Load ONNX Runtime at run time (`dlopen`) instead of linking pyke's prebuilt
# static library (#504): the build for a target pyke ships no binaries for —
# IBM Z `s390x-unknown-linux-gnu` first of all, also ppc64le/riscv64 — and
# for deployments that bring their own `libonnxruntime.so`. `ort`'s
# `load-dynamic` turns off `ort-sys`'s download/link step entirely, so this
# feature is additive to the `download-binaries` the workspace declares. The
# library is located by [`runtime_library`](crate::runtime_library) at the
# first session: `ORT_DYLIB_PATH`, `.models/onnxruntime/libonnxruntime.so`
# (the models-dir resolution, #285), then the system search path; a build
# without it keeps every ML stage unavailable and degrading like a missing
# model (the declarative formats and the PDF text layer never touch it).
load-dynamic = ["ort/load-dynamic", "dep:libloading"]

[dependencies]
docling-core = { path = "../docling-core", version = "2.62.0" }
# Same ort build as docling-pdf/docling-asr so the workspace keeps a single
# ONNX Runtime.
ort = { version = "2.0.0-rc.14", default-features = false, features = ["std", "download-binaries", "tls-rustls"] }
# `load-dynamic` only: reads the loaded library's version string
# ([`runtime_version`](crate::runtime_version)) — the same crate `ort` opens it with.
libloading = { version = "0.8", optional = true }

[dev-dependencies]
# glibc_compat's tests compare the C23 `strtol` shims against glibc's own
# `__isoc23_*` (dlsym on libc.so.6) where the host has them.
libloading = "0.8"
