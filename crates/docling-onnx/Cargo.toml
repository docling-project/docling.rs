[package]
name = "docling-onnx"
description = "Shared ONNX Runtime execution-provider selection for docling.rs (DOCLING_RS_EP)."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
rust-version.workspace = true

[features]
# copy-dylibs rides along on every GPU feature: the CUDA/TensorRT providers
# are separate shared libraries (libonnxruntime_providers_*.so) that must sit
# next to the binary at runtime — without the copy, registration fails with a
# bare "cannot open shared object file" even on a machine with a working GPU.
cuda = ["ort/cuda", "ort/copy-dylibs"]
tensorrt = ["ort/tensorrt", "ort/copy-dylibs"]
directml = ["ort/directml", "ort/copy-dylibs"]
coreml = ["ort/coreml", "ort/copy-dylibs"]
# XNNPACK is a CPU-class EP (ARM NEON / x86 SIMD kernels), statically linked —
# no provider dylib to copy (#324). NOTE: pyke ships no prebuilt ONNX Runtime
# with the XNNPACK EP (any target), so this feature links only against a
# self-built ONNX Runtime (`ORT_LIB_LOCATION`, onnxruntime built with
# `--use_xnnpack`) — with `download-binaries` the build fails at link time by
# design. Keep it out of CI matrices that rely on downloaded binaries.
xnnpack = ["ort/xnnpack"]

[dependencies]
docling-core = { path = "../docling-core", version = "1.36.0" }
# Same ort build as docling-pdf/docling-asr so the workspace keeps a single
# ONNX Runtime.
ort = { version = "2.0.0-rc.13", default-features = false, features = ["std", "download-binaries", "tls-rustls"] }
