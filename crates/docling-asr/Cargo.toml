[package]
name = "docling-asr"
description = "Audio/ASR pipeline for docling.rs (Whisper via ONNX; a Rust port of docling's ASR pipeline)."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
rust-version.workspace = true

[features]
cuda = ["docling-onnx/cuda"]
tensorrt = ["docling-onnx/tensorrt"]
directml = ["docling-onnx/directml"]
coreml = ["docling-onnx/coreml"]
# CPU-class XNNPACK (#324). Opt-in and out of every CI matrix by design: pyke
# ships no prebuilt ONNX Runtime carrying this EP, so it links only against a
# self-built runtime (`ORT_LIB_LOCATION`, onnxruntime built with
# `--use_xnnpack`).
xnnpack = ["docling-onnx/xnnpack"]

[dependencies]
docling-core = { path = "../docling-core", version = "1.36.0" }
# Shared ONNX execution-provider selection (DOCLING_RS_EP, #288) — routes the
# Whisper encoder/decoder sessions through the same switch as docling-pdf.
docling-onnx = { path = "../docling-onnx", version = "1.36.0" }
# Same ort as docling-pdf so the workspace keeps a single ONNX runtime.
ort = { version = "2.0.0-rc.13", default-features = false, features = ["std", "download-binaries", "tls-rustls"] }
serde_json = "1"
# Pure-Rust audio demuxing/decoding for every container docling's ASR accepts:
# wav (pcm), mp3, flac, ogg/vorbis, aac (adts), m4a/mp4 (isomp4+aac).
symphonia = { version = "0.5", default-features = false, features = ["wav", "pcm", "mp3", "flac", "ogg", "vorbis", "aac", "isomp4", "mkv"] }
