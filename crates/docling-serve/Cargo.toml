[package]
name = "docling-serve"
description = "HTTP conversion API over the docling.rs converter (docling-serve analogue)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
default = ["chunking"]
# Tokenization-aware chunking: enables the hybrid chunk records in `to=chunks`
# responses (hierarchical records work without it).
chunking = ["docling/chunking"]
# Cloud source/target passthrough (#139, upstream docling#3795): S3 / Azure
# Blob / GCS request sources and output targets through `object_store`. Off
# by default — the kinds still parse without it and answer a clear
# rebuild-with-the-feature error.
cloud = ["dep:object_store"]
# GPU execution providers for the PDF/image ML pipeline (#74) — pass-through
# to docling → docling-pdf; select at runtime with DOCLING_RS_EP.
cuda = ["docling/cuda"]
# HEIC/HEIF image input (#211) — links the system libheif.
heif = ["docling/heif"]
tensorrt = ["docling/tensorrt"]
directml = ["docling/directml"]
coreml = ["docling/coreml"]
# CPU-class XNNPACK (#324): self-built ONNX Runtime only (ORT_LIB_LOCATION).
xnnpack = ["docling/xnnpack"]
# OpenTelemetry trace export (#297): request/conversion spans shipped over
# OTLP when OTEL_EXPORTER_OTLP_ENDPOINT is set at runtime. Off by default —
# the OTel SDK stack is heavy; structured tracing logs and the Prometheus
# /metrics endpoint need no feature at all.
otel = [
    "dep:tracing-opentelemetry",
    "dep:opentelemetry",
    "dep:opentelemetry_sdk",
    "dep:opentelemetry-otlp",
]

[dependencies]
axum = { version = "0.8", features = ["multipart"] }
docling = { path = "../docling", version = "1.36.0" }
docling-core = { path = "../docling-core", version = "1.36.0" }
# malloc_trim after conversions (#263): glibc's allocator otherwise keeps
# freed page-bitmap heap mapped forever, ratcheting a warm server's RSS.
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "net", "signal"] }
tokio-stream = "0.1"
# Cloud passthrough (#139): one uniform client for S3/GCS/Azure, only in the
# graph under the opt-in `cloud` feature (it brings its own HTTP stack).
object_store = { version = "0.12", features = ["aws", "azure", "gcp"], optional = true }
# URL inputs are fetched with the same blocking client the converter already
# uses for remote <img src> (keeps the dependency graph to a single HTTP stack).
ureq = { version = "3", default-features = false, features = ["rustls", "gzip"] }
# Parse URL-fetch inputs to validate the host against the SSRF IP block-list
# before connecting (already in the graph via ureq).
url = "2"
# Structured logs + spans (#297): every request logs through `tracing`
# (RUST_LOG-filtered, default info) and the same spans feed the optional
# OTel export below.
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
# OTLP trace export, behind the opt-in `otel` feature (versions move in
# lockstep — tracing-opentelemetry 0.33 pairs with opentelemetry 0.32).
tracing-opentelemetry = { version = "0.33.0", optional = true }
opentelemetry = { version = "0.32.0", optional = true }
opentelemetry_sdk = { version = "0.32.1", features = ["rt-tokio"], optional = true }
# OTLP/gRPC only (the Python default transport); the default http-proto
# transport would pull a second HTTP client stack (reqwest) into the graph.
opentelemetry-otlp = { version = "0.32.0", default-features = false, features = ["trace", "grpc-tonic"], optional = true }

[dev-dependencies]
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }
