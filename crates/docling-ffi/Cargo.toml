# Minimal C ABI over the document converter (issue #193) — the single
# `extern "C"` surface every FFI-capable language (C, C++, C#, Go, Java,
# Swift, …) can embed, superseding the per-language C++ bindings idea (#34).
#
# The deliverable is the shared/static library plus the committed
# `include/docling.h` header (generated by cbindgen — see the crate README
# for the regeneration command). Options travel as one JSON string whose
# keys mirror docling-serve's request options.
[package]
name = "docling-ffi"
description = "Minimal C ABI for docling.rs (a Rust port of docling): embed the converter from C, C++, C#, Go, Java, Swift, …"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme = "README.md"
rust-version.workspace = true
# Not a crates.io library — the deliverable is the C library artifact.
publish = false

[lib]
# Both linkage styles: `cdylib` for dlopen/LoadLibrary embedders (C#, Java,
# Go cgo with dynamic linking), `staticlib` for direct static linking.
crate-type = ["cdylib", "staticlib"]

[dependencies]
docling = { path = "../docling", version = "1.36.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
# GPU execution providers (#74) — pass-through to the docling crate, same as
# the CLI/serve/py/node surfaces; which provider actually runs is chosen at
# startup via DOCLING_RS_EP.
cuda = ["docling/cuda"]
tensorrt = ["docling/tensorrt"]
directml = ["docling/directml"]
coreml = ["docling/coreml"]
